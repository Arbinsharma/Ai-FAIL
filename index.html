<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Tech News Portal</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --text-muted: #6c757d;
            --accent-color: #0d6efd;
            --border-color: #dee2e6;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f8f9fa;
            --text-muted: #adb5bd;
            --accent-color: #3b82f6;
            --border-color: #2d3748;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background 0.3s ease, color 0.3s ease;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background-color: #ddd;
        }

        .card-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card h3 {
            margin: 0 0 0.75rem 0;
            font-size: 1.15rem;
            line-height: 1.4;
        }

        .card h3 a {
            color: var(--text-color);
            text-decoration: none;
        }

        .card h3 a:hover {
            color: var(--accent-color);
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0 0 1.25rem 0;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 0.75rem;
        }

        footer {
            text-align: center;
            padding: 3rem 1rem;
            margin-top: 4rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer span {
            font-weight: bold;
            color: var(--text-color);
        }

        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 4rem;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Tech & AI Pulse</h1>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 Theme</button>
    </header>

    <div class="container">
        <div id="news-grid" class="grid">
            <div class="loading">Loading latest breaking articles...</div>
        </div>
    </div>

    <footer>
        <p>Developed with passion by <span>Prashant Bhusal & Arbin Sharma</span> (Grade 9, Rosy Buds Bal Batika, Nepal)</p>
        <p>Contact: <a href="mailto:prashantvushal@gmail.com" style="color: var(--accent-color);">prashantvushal@gmail.com</a></p>
    </footer>

    <script>
        // Theme Switcher Logic
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
        }

        // Load saved theme preference
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Fetch and Render News from news.json
        async function loadNews() {
            const grid = document.getElementById('news-grid');
            try {
                const response = await fetch('news.json?' + new Date().getTime()); // bypass cache
                if (!response.ok) throw new Error('Failed to load news data.');
                
                const articles = await response.json();
                
                if (articles.length === 0) {
                    grid.innerHTML = '<div class="loading">No articles available right now. Check back soon!</div>';
                    return;
                }

                grid.innerHTML = '';
                articles.forEach(article => {
                    const dateStr = new Date(article.published).toLocaleDateString(undefined, {
                        month: 'short', day: 'numeric', year: 'numeric'
                    });

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${article.image_url}" alt="Article Cover Image" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80'">
                        <div class="card-content">
                            <h3><a href="${article.url}" target="_blank" rel="noopener noreferrer">${article.title}</a></h3>
                            <p>${article.summary}</p>
                            <div class="card-footer">
                                <span>Published</span>
                                <span>${dateStr}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = '<div class="loading">Unable to load news feed. Please run python3 fetch_news.py to generate news.json.</div>';
            }
        }

        loadNews();
    </script>
</body>
</html>
